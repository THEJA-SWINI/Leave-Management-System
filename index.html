<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leave Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Leave Management System</h1>

        <!-- Leave Form -->
        <div class="form-container">

            <h2 id="form-title">Add Leave Request</h2>

            <form id="leaveForm">

                <!-- Hidden Leave ID -->
                <input type="hidden" id="leaveId">

                <!-- Employee ID -->
                <div class="form-group">

                    <label for="employeeId">
                        Employee ID
                    </label>

                    <input
                        type="number"
                        id="employeeId"
                        placeholder="Enter employee ID"
                        required
                    >

                </div>

                <!-- Employee Name -->
                <div class="form-group">

                    <label for="employeeName">
                        Employee Name
                    </label>

                    <input
                        type="text"
                        id="employeeName"
                        placeholder="Enter employee name"
                        required
                    >

                </div>

                <!-- Leave Type -->
                <div class="form-group">

                    <label for="leaveType">
                        Leave Type
                    </label>

                    <select id="leaveType" required>

                        <option value="">
                            Select Leave Type
                        </option>

                        <option value="Sick Leave">
                            Sick Leave
                        </option>

                        <option value="Casual Leave">
                            Casual Leave
                        </option>

                        <option value="Earned Leave">
                            Earned Leave
                        </option>

                        <option value="Emergency Leave">
                            Emergency Leave
                        </option>

                    </select>

                </div>

                <!-- Dates -->
                <div class="date-row">

                    <div class="form-group">

                        <label for="fromDate">
                            From Date
                        </label>

                        <input
                            type="date"
                            id="fromDate"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="toDate">
                            To Date
                        </label>

                        <input
                            type="date"
                            id="toDate"
                            required
                        >

                    </div>

                </div>

                <!-- Reason -->
                <div class="form-group">

                    <label for="reason">
                        Reason
                    </label>

                    <textarea
                        id="reason"
                        rows="4"
                        placeholder="Enter reason for leave"
                        required
                    ></textarea>

                </div>

                <!-- Buttons -->
                <div class="button-group">

                    <button
                        type="submit"
                        class="btn primary-btn"
                        id="submitBtn"
                    >
                        Add Leave
                    </button>

                    <button
                        type="button"
                        class="btn cancel-btn"
                        id="cancelBtn"
                        onclick="resetForm()"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </div>

        <!-- Leave Requests Table -->
        <div class="table-container">

            <h2>Leave Requests</h2>

            <div id="message"></div>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>Leave ID</th>
                            <th>Employee ID</th>
                            <th>Employee Name</th>
                            <th>Leave Type</th>
                            <th>From Date</th>
                            <th>To Date</th>
                            <th>Reason</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="leaveTableBody">
                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
